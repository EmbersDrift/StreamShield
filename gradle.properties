# --- StreamShield build ---
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Requires JDK 21 (Loom 1.17 needs a JDK >=21). Set JAVA_HOME to a JDK 21 install, or
# have a `java` 21 on PATH, before running `gradlew`. On this machine:
#   $env:JAVA_HOME="C:\Users\ember\.jdks\jdk-21.0.12.1+1"; .\gradlew.bat build
#
# NOTE: No proxy is configured here so GitHub Actions can build with direct internet.
# If you are behind a proxy (e.g. Clash) on your own machine, add the lines below to
# your USER-level ~/.gradle/gradle.properties (not committed) instead:
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7890
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7890

# Mod properties
mod_version = 1.1.3
maven_group = livehider
archives_name = StreamShield

# Minecraft / mappings
minecraft_version = 1.21.11

# Dependencies
loader_version = 0.18.6
fabric_api_version = 0.141.6+1.21.11
architectury_version = 19.0.1
cloth_config_version = 21.11.153
