# --- StreamShield build ---
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.1+ requires JDK 25 minimum for the Gradle JVM (Loom 1.17 needs JDK >=21).
# Set JAVA_HOME to a JDK 25+ install, or have a `java` 25+ on PATH, before running `gradlew`.
# On this machine (Java 26 on PATH):
#   .\gradlew.bat build
#
# NOTE: No proxy is configured here so GitHub Actions can build with direct internet.
# If you are behind a proxy (e.g. Clash) on your own machine, add the lines below to
# your USER-level ~/.gradle/gradle.properties (not committed) instead:
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7890
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7890

# Mod properties
mod_version = 1.1.3
maven_group = livehider
archives_name = StreamShield

# Minecraft / mappings (26.1+ is unobfuscated; no Yarn/mojmap remapping)
minecraft_version = 26.1.2

# Dependencies
loader_version = 0.19.3
fabric_api_version = 0.155.2+26.1.2
architectury_version = 20.0.12
cloth_config_version = 26.1.154
