plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = project.mod_version
group = project.maven_group

ext.releaseLoader = 'fabric'
apply from: 'gradle/release-support.gradle'

repositories {
    mavenCentral()
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    // 26.1+ is unobfuscated: the game ships official names, so no remapping is needed.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${project.architectury_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.4"
    include "io.github.llamalad7:mixinextras-fabric:0.5.4"

    // Optional integration: Mod Menu config entrypoint (compile-time only; runtime optional).
    implementation "com.terraformersmc:modmenu:21.0.0"

    // Overlay hook layer: JNA (native hook) + commons-io.
    implementation "net.java.dev.jna:jna:5.19.1"
    include "net.java.dev.jna:jna:5.19.1"
    implementation "commons-io:commons-io:2.22.0"
    include "commons-io:commons-io:2.22.0"
}

java {
    // 26.1 requires Java 25+; we compile with --release 25 on whatever JDK runs Gradle (25+).
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

// Version- and loader-prefixed jar names, e.g. [26.1.2]StreamShield-1.1.0-fabric.jar, so builds
// for different Minecraft versions/loaders can be told apart when uploading.
// Loom overrides remapJar's file name after script evaluation, so force it in afterEvaluate.
tasks.withType(Jar).configureEach {
    archiveFileName = "[${project.minecraft_version}]${project.archives_name}-${project.version}-fabric.jar"
}
afterEvaluate {
    def remap = tasks.findByName('remapJar')
    if (remap != null) {
        remap.archiveFileName = "[${project.minecraft_version}]${project.archives_name}-${project.version}-fabric.jar"
    }
}
