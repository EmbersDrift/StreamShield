plugins {
    id 'fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "io.github.llamalad7:mixinextras-fabric:0.5.4"
    include "io.github.llamalad7:mixinextras-fabric:0.5.4"

    // Optional integration: Mod Menu config entrypoint (compile-time only; runtime optional).
    modImplementation "com.terraformersmc:modmenu:17.0.0"

    // Overlay hook layer: JNA (native hook) + commons-io.
    implementation "net.java.dev.jna:jna:5.19.1"
    include "net.java.dev.jna:jna:5.19.1"
    implementation "commons-io:commons-io:2.22.0"
    include "commons-io:commons-io:2.22.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}
